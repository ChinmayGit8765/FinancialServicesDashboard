spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quantlens}
    username: ${SPRING_DATASOURCE_USERNAME:quantlens}
    password: ${SPRING_DATASOURCE_PASSWORD:quantlens_dev}
  data:
    web:
      pageable:
        # Cap page size to prevent ?size=10000 DoS abuse (threat T-02-05)
        max-page-size: 500
        default-page-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    vectorstore:
      pgvector:
        # FALSE — Flyway V1 owns the vector_store DDL; MUST stay false in all future phases
        # incl. Phase 7 RAG to avoid DDL divergence
        initialize-schema: false
        # Locked 1536 — OpenAI text-embedding-3-small; cannot change without drop+re-embed
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    anthropic:
      # DEMO_NO_KEY sentinel: non-blank placeholder allows Spring context to load without a real key.
      # DemoModeAdvisor short-circuits before any network call fires, so this value never reaches a provider.
      # Override with ANTHROPIC_API_KEY env var to switch to live mode.
      api-key: ${ANTHROPIC_API_KEY:DEMO_NO_KEY}
      chat:
        options:
          # Override Spring AI default (claude-sonnet-4-5) with current Sonnet generation (RESEARCH Pitfall 7)
          model: claude-sonnet-4-6
          max-tokens: 2048
    openai:
      # Same sentinel pattern as Anthropic (RESEARCH Pattern 4)
      api-key: ${OPENAI_API_KEY:DEMO_NO_KEY}
      chat:
        options:
          model: gpt-4o
          max-tokens: 2048
    chat:
      client:
        # false — prevents ambiguous ChatClient bean when both Anthropic and OpenAI starters are present (RESEARCH Pitfall 6 / A4)
        # ChatClientStrategy builds ChatClient instances per-request via ChatClient.builder(model)
        enabled: false

logging:
  level:
    # WARN — prevents SimpleLoggerAdvisor from logging prompt/response details at DEBUG (RESEARCH Pitfall 4 / T-06-02)
    org.springframework.ai: WARN

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
    session-tracking-modes: cookie

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Demo configuration — password is intentionally surfaced on the login screen
# so first-time visitors can click a persona without typing.  Override via
# QUANTLENS_DEMO_PASSWORD env var to change in any deployment.
#
# WR-07: The default 'demo1234' is intentional for the zero-setup demo UX.
# SECURITY NOTE: This default must be overridden via QUANTLENS_DEMO_PASSWORD
# for any non-local deployment. The seeded demo personas (alice/bob/charlie)
# use this password and the login screen displays it — this is by design for
# a portfolio showcase app. DO NOT use this default in any production deployment.
quantlens:
  demo:
    password: ${QUANTLENS_DEMO_PASSWORD:demo1234}
