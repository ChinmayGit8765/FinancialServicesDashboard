# Test profile — @ActiveProfiles("test")
# Datasource is supplied at runtime by Testcontainers @ServiceConnection — do NOT hardcode jdbc URL here.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    vectorstore:
      pgvector:
        # FALSE — Flyway V1 owns the vector_store DDL; MUST stay false in all future phases
        # incl. Phase 7 RAG to avoid DDL divergence
        initialize-schema: false
        # Locked 1536 — OpenAI text-embedding-3-small; cannot change without drop+re-embed
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    anthropic:
      # TEST_SENTINEL — mirrors prod sentinel pattern; allows integration test context to boot key-less
      api-key: TEST_SENTINEL
    openai:
      api-key: TEST_SENTINEL
    chat:
      client:
        enabled: false
