services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Database — PostgreSQL 16 with pgvector extension pre-installed
  # Named volume (NOT bind mount) — required on Windows to avoid NTFS/WSL2 corruption
  # ─────────────────────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: quantlens
      POSTGRES_USER: quantlens
      # Dev-only credential — documented as non-secret; never used in production
      POSTGRES_PASSWORD: quantlens_dev
    volumes:
      # Init script — creates pgvector extension as postgres superuser (must run before Flyway)
      - ./docker/db/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      # Named volume for PG data — MUST be a named volume on Windows (NTFS bind-mounts corrupt data)
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlens -d quantlens"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Allow extra time for Docker to run the init scripts on first start
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend — Spring Boot 3.5.13 / Java 21
  # Waits for db: condition: service_healthy to avoid HikariCP timeout on cold start
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/quantlens
      SPRING_DATASOURCE_USERNAME: quantlens
      SPRING_DATASOURCE_PASSWORD: quantlens_dev
      # demo profile activates ApplicationRunner seeder + demo-mode AI responses (no key required)
      SPRING_PROFILES_ACTIVE: demo
      # NO AI keys here — keys are session-only (BYO-key popup, Phase 6)
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend — Vue 3 SPA served via nginx
  # nginx proxies /api/* to http://backend:8080/api/* inside the compose network
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # nginx listens on :80 inside the container; exposed on host as :5173
      - "5173:80"
    depends_on:
      backend:
        # Wait until the backend Spring Boot app has fully started and passed
        # /actuator/health before nginx comes up — eliminates 502s during seed (WR-08)
        condition: service_healthy

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes
# postgres_data must be declared here for Docker to manage it
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
