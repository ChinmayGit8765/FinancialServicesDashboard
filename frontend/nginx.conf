server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — route all 404s to index.html so vue-router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend service (backend hostname = "backend" in docker compose network)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forward session cookie and CSRF token with SameSite=Lax for CSRF defence (T-01-14)
        proxy_cookie_flags ~JSESSIONID secure samesite=lax;
    }
}
