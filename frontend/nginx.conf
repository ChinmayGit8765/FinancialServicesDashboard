server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — route all 404s to index.html so vue-router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend service (backend hostname = "backend" in docker compose network)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Do NOT force Secure flag — the demo stack runs over plain HTTP (http://localhost).
        # Browsers silently drop cookies with the Secure flag when received over HTTP (RFC 6265),
        # which would break session auth in any non-HTTPS deployment.
        # SameSite=Lax is already set by Spring's server.servlet.session.cookie.same-site: lax
        # so no nginx-level cookie rewriting is needed here.
    }
}
